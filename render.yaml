services:
  - type: web
    name: bfhl-api
    runtime: image # Or use native java environment
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/bfhl-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: PORT
        value: 8080
